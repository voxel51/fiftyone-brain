name: Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone fiftyone-brain
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Check Python correctness
        run: ruff check --output-format=github .

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone fiftyone-brain
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check Python version
        run: |
          python --version
          pip --version
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install build
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref }}
        run: |
          # A tag must match the VERSION file exactly, including any .devN or
          # rcN suffix
          version=$(tr -d '\r\n' < VERSION)
          if [[ "$RELEASE_TAG" == refs/tags/v* ]] &&
            [ "${RELEASE_TAG#refs/tags/v}" != "$version" ]; then
            echo "::error::Tag ${RELEASE_TAG#refs/tags/} does not match VERSION $version"
            exit 1
          fi
          echo "Building fiftyone-brain $version"
      - name: Build wheel
        run: |
          python -m build
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  test:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      FIFTYONE_DATASET_ZOO_DIR: ${{ github.workspace }}/.fiftyone
      FIFTYONE_DO_NOT_TRACK: true
      FIFTYONE_MODEL_ZOO_DIR: ${{ github.workspace }}/.fiftyone
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Clone fiftyone-brain
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Clone fiftyone
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: fiftyone-src
          ref: main
          repository: voxel51/fiftyone
      - name: Clone voxel51-eta
        uses: actions/checkout@v7
        if: ${{ !startsWith(github.ref, 'refs/heads/rel') && !startsWith(github.ref, 'refs/tags/') }}
        with:
          fetch-depth: 1
          path: eta
          ref: main
          repository: voxel51/eta
      # ETA tests will create a storage client which,
      # in it's __init__, tries to log in to GCP.
      # See tests/tests_uniqueness.py
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.REPO_GCP_PROJECT }}
          service_account: ${{ secrets.REPO_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.REPO_GOOGLE_WORKLOAD_IDP }}
      - name: Set Up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Free Disk Space (Ubuntu) # standard runner's 14 GB available disk size isn't enough. Need at least 22 GB free.
        uses: jlumbroso/free-disk-space@v1.3.1
      - name: Install dependencies
        run: |
          pip install --upgrade pip build
      - name: Download fiftyone-brain wheel
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install fiftyone
        working-directory: fiftyone-src
        run: |
          python -m build --wheel
          pip install voxel51-eta[storage] fiftyone-db
          pip install ./dist/*.whl
      - name: Install ETA from source
        working-directory: eta
        # Don't install from source if this is a release.
        # Install from PyPI
        if: ${{ !startsWith(github.ref, 'refs/heads/rel') && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Installing ETA from source because github.ref = ${{ github.ref }} (not a release)"
          python -m build --wheel
          pip install ./dist/*.whl --force-reinstall
      - name: Reinstall fiftyone-brain
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
      - name: Install test dependencies
        run: |
          pip install imageio pytest torch torchvision lancedb
      - name: Cache Zoo
        id: fiftyone-cache
        uses: actions/cache@v6
        with:
          path: |
            .fiftyone
          # What is cached are the zoo datasets and models the tests ask
          # for, but the key changes whenever any test file does -- so an
          # edit anywhere under tests/ used to re-download CIFAR-10 and a
          # model on every matrix leg. The prefix restores the newest cache
          # whatever the hash, and a fresh one is still saved under the new
          # key, so an added asset is picked up without paying for the rest
          key: zoo-${{ hashFiles('tests/**') }}
          restore-keys: |
            zoo-
      - name: Run tests
        run: |
          pytest --verbose tests/ --ignore tests/intensive/

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release # For trusted publishing. See below.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Utilize
      # [trusted publishers](https://docs.pypi.org/trusted-publishers/)
      # This will use OIDC to publish the dists/ package to pypi.
      # See
      # [fiftyone-brain](https://pypi.org/manage/project/fiftyone-brain/settings/publishing/)
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2

  bump:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Find the next version
        id: next
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.dev([0-9]+)$ ]]; then
            branch=main
            next="${BASH_REMATCH[1]}.dev$((BASH_REMATCH[2] + 1))"
          elif [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]]; then
            branch="release/v${BASH_REMATCH[1]}"
            next="${BASH_REMATCH[1]}rc$((BASH_REMATCH[2] + 1))"
          else
            echo "$version is a final release; nothing to bump"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Clone fiftyone-brain
        if: steps.next.outputs.next
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.next.outputs.branch }}
          # voxel51-bot bypasses branch protection on main and release/v*
          token: ${{ secrets.FIFTYONE_GITHUB_TOKEN }}
      - name: Commit the next version
        if: steps.next.outputs.next
        env:
          VERSION: ${{ steps.next.outputs.version }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          if [ "$(tr -d '\r\n' < VERSION)" != "$VERSION" ]; then
            echo "::notice::VERSION moved past $VERSION; nothing to bump"
            exit 0
          fi
          printf '%s\n' "$NEXT" > VERSION
          git config user.name "voxel51-bot"
          git config user.email "voxel51-bot@users.noreply.github.com"
          git commit -am "chore: bump VERSION to $NEXT"
          git push
